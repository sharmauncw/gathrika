<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gathrika Skin Clinic — Best Skin Clinic in Medipally, Hyderabad</title>
<meta name="description" content="Gathrika Skin Clinic in Peerzadiguda, Medipally — doctor-led care for skin, hair & nails by Dr. G. Kiranmayee (MBBS, DDVL). Acne, pigmentation, laser, hair fall & more. Book a consultation.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232F5D50'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%23C9A27E' font-family='Georgia,serif' font-weight='bold'%3EG%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="site-chrome"></div>

<main>
  <!-- ===== Hero: photo panel, one line, two buttons ===== -->
  <section class="hero-v">
    <div class="container">
      <div class="hero-panel">
        <img class="hero-bg" src="assets/hero.webp" alt="Inside Gathrika Skin Clinic" fetchpriority="high">
        <div class="hero-copy">
          <span class="chip">Medipally · Peerzadiguda · Hyderabad</span>
          <h1>Gathrika Skin Clinic</h1>
          <p data-te="చర్మం, జుట్టు మరియు గోళ్ల కోసం డాక్టర్ నేతృత్వంలోని సంరక్షణ — ఇక్కడే మేడిపల్లిలో.">Doctor-led care for skin, hair &amp; nails — right here in Medipally.</p>
        </div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-primary btn-lg" href="book.html" data-te="అపాయింట్‌మెంట్ బుక్ చేయండి">Book Appointment</a>
        <a class="btn btn-outline btn-lg" id="hero-call" href="#">Call the clinic</a>
      </div>
      <div class="stat-strip" id="stat-strip"></div>
    </div>
  </section>

  <!-- ===== Common concerns ===== -->
  <section class="section section-tight">
    <div class="container">
      <div class="section-head reveal">
        <h2>What brings you in?</h2>
      </div>
      <div class="concern-grid" id="concern-grid"></div>
    </div>
  </section>

  <!-- ===== Popular treatments ===== -->
  <section class="section section-tight section-band">
    <div class="container">
      <div class="section-head reveal">
        <h2>Popular treatments</h2>
        <a class="btn btn-outline btn-sm" href="treatments.html" style="min-height:44px">All 16 treatments</a>
      </div>
      <div class="grid grid-3" id="featured"></div>
    </div>
  </section>

  <!-- ===== Doctor ===== -->
  <section class="section section-tight">
    <div class="container">
      <div class="doctor-band reveal" id="doctor-band"></div>
    </div>
  </section>

  <!-- ===== Reviews ===== -->
  <section class="section section-tight section-band">
    <div class="container">
      <div class="section-head reveal">
        <h2>Patients say</h2>
        <a class="btn btn-outline btn-sm" href="reviews.html" style="min-height:44px">Read reviews</a>
      </div>
      <div id="home-reviews"></div>
    </div>
  </section>

  <!-- ===== Hours & visit ===== -->
  <section class="section section-tight">
    <div class="container">
      <div class="grid grid-2" id="visit-blocks"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="data.js"></script>
<script src="backend.js"></script>
<script>
  renderChrome("home");

  /* Call button */
  document.getElementById("hero-call").href = callHref();

  /* Stat strip: the four facts patients ask first */
  document.getElementById("stat-strip").innerHTML = [
    { icon: "star",        big: CLINIC.ratingJustdial.score + " / 5", small: CLINIC.ratingJustdial.count + " reviews on Justdial" },
    { icon: "plus-circle", big: "Rs " + CLINIC.consultFee,     small: "Consultation · pay at clinic" },
    { icon: "clock",       big: "11–1 & 5–8",                   small: "Mon – Sat · Sunday closed" },
    { icon: "cap",         big: "12+ years",                    small: "Dr. G. Kiranmayee, MBBS DDVL" }
  ].map(s => `<div class="stat"><span class="stat-ic">${iconSvg(s.icon, 21)}</span><div><strong>${s.big}</strong><span>${s.small}</span></div></div>`).join("");

  /* Concern tiles: icon-led, one short line each */
  const CONCERNS = [
    { slug: "acne-treatment",           t: "Pimples & marks",  d: "Acne, dark marks & scars" },
    { slug: "pigmentation-treatment",   t: "Dark patches",     d: "Melasma, sun spots & tanning" },
    { slug: "hair-fall-treatment",      t: "Hair fall",        d: "Thinning, shedding & causes" },
    { slug: "skin-rash-allergy-fungal", t: "Itching & rashes", d: "Allergy, fungal & eczema" },
    { slug: "anti-aging-solutions",     t: "Fine lines",       d: "Peels, laser & skin quality" },
    { slug: "laser-therapy",            t: "Unwanted hair",    d: "Laser hair reduction" }
  ];
  document.getElementById("concern-grid").innerHTML = CONCERNS.map(c => {
    const s = serviceBySlug(c.slug);
    return `<a class="concern reveal" href="treatments.html#${s.slug}">
      <span class="c-ic">${iconSvg(s.icon, 23)}</span>
      <h3>${c.t}</h3><p>${c.d}</p>
      <span class="c-go">See treatment ${iconSvg("arrow", 16)}</span></a>`;
  }).join("");

  /* Featured treatment cards: art band + name + one line */
  document.getElementById("featured").innerHTML =
    ["dermatology-consultation","acne-treatment","laser-therapy","hydrafacial-medi-facial","chemical-peels","hair-fall-treatment"]
    .map(slug => { const s = serviceBySlug(slug); return `
    <article class="card tcard reveal">
      <div class="art-band ${categoryClass(s.category)}"><span class="art-medal">${iconSvg(s.icon, 27)}</span><span class="art-chip"><span class="chip">${s.category}</span></span></div>
      <h3>${s.name}</h3>
      <p>${s.short}</p>
      <div class="tcard-foot">
        <span class="fee">${s.priceDisplay}</span>
        <a class="go" href="treatments.html#${s.slug}">Details ${iconSvg("arrow", 16)}</a>
        <a class="btn btn-primary btn-sm book-mini" href="book.html?service=${s.slug}">Book</a>
      </div>
    </article>`; }).join("");

  /* Doctor band */
  document.getElementById("doctor-band").innerHTML = `
    <div style="text-align:center">
      <div class="monogram" role="img" aria-label="Dr. G. Kiranmayee">
        <span class="mono-initials">GK</span><span class="mono-sub">MBBS · DDVL</span>
      </div>
    </div>
    <div>
      <span class="chip" style="background:rgba(255,255,255,.14);color:#F0D9B5">Meet your doctor</span>
      <h2 style="margin-top:10px">${CLINIC.doctor}</h2>
      <div class="cred-rows">
        <div class="cred-row"><span class="stat-ic">${iconSvg("cap", 19)}</span><span>MBBS — Gandhi Medical College · DDVL (Skin)</span></div>
        <div class="cred-row"><span class="stat-ic">${iconSvg("clock", 19)}</span><span>12+ years in dermatology</span></div>
        <div class="cred-row"><span class="stat-ic">${iconSvg("shield", 19)}</span><span>${CLINIC.registration}</span></div>
      </div>
      <div class="hero-actions">
        <a class="btn btn-accent btn-lg" href="book.html">Book consultation</a>
        <a class="btn btn-outline btn-lg" href="about.html">About the doctor</a>
      </div>
    </div>`;

  /* Reviews preview */
  document.getElementById("home-reviews").innerHTML = `
    <div class="rating-band reveal" style="margin-bottom:14px">
      <div><div class="rating-big">${CLINIC.ratingJustdial.score}</div><div class="stars" aria-hidden="true">${starsHtml(5)}</div></div>
      <div>
        <strong style="font-family:'Fraunces',serif;font-size:1.15rem;color:var(--primary-dark)">Rated by patients</strong>
        <div class="rb-sub">${CLINIC.ratingJustdial.count} reviews on Justdial · 2 patient stories on Practo, both recommend the doctor</div>
      </div>
    </div>
    <div class="grid grid-2">` +
    TESTIMONIALS.map(t => `
      <article class="card quote-card reveal">
        <div class="stars" aria-hidden="true">${starsHtml(5)}</div>
        <blockquote>${t.quote}</blockquote>
        <p class="small" style="margin:0"><strong>${t.name}</strong> — ${t.treatment}<br><span class="muted">${t.source}</span></p>
      </article>`).join("") + `</div>`;

  /* Visit blocks: hours + find us */
  document.getElementById("visit-blocks").innerHTML = `
    <div class="info-card reveal">
      <div class="info-head"><span class="stat-ic">${iconSvg("clock", 22)}</span><h3>Clinic hours</h3></div>
      <div class="info-lines">
        <div class="info-line"><span class="k">Morning</span><span class="v">11 AM – 1 PM</span></div>
        <div class="info-line"><span class="k">Evening</span><span class="v">5 PM – 8 PM</span></div>
        <div class="info-line"><span class="k">Sunday</span><span class="v">Closed</span></div>
        <div class="info-line"><span class="k">Consultation</span><span class="v">Rs ${CLINIC.consultFee} · at clinic</span></div>
      </div>
      <a class="btn btn-primary btn-block" href="book.html" style="margin-top:14px">Book Appointment</a>
    </div>
    <div class="info-card reveal">
      <div class="info-head"><span class="stat-ic">${iconSvg("pin", 22)}</span><h3>Find us</h3></div>
      <p style="margin:0 0 6px"><strong>${CLINIC.addressLines[0]}</strong><br>${CLINIC.addressLines.slice(1).join("<br>")}</p>
      <p class="small" style="margin:0 0 6px">Call / WhatsApp: <a href="${callHref()}">${phoneDisplay()}</a></p>
      <div class="hero-actions" style="margin-top:12px">
        <a class="btn btn-primary" href="${mapsDirUrl()}" target="_blank" rel="noopener">Directions</a>
        <a class="btn btn-outline" href="${waHref('Hello Gathrika Skin Clinic, I have a question.')}">WhatsApp us</a>
      </div>
    </div>`;
</script>
</body>
</html>
